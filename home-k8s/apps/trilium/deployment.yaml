apiVersion: apps/v1
kind: Deployment
metadata:
  name: trilium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trilium
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trilium
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsNonRoot: true
      containers:
        - name: trilium
          image: triliumnext/trilium:stable@sha256:d5b37abc261b8ed93d01deb91938bbbfe7cf409b0dc8e00d1461fc1a7b280f5f  # trilium:v0.104.1
          # At the time the rootless image is not available, so we need to skip the startpoint that uses su.
          command: ["node", "./main.cjs"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: TRILIUM_DATA_DIR
              value: /home/node/trilium-data
            - name: TRILIUM_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: trilium
              mountPath: /home/node/trilium-data
      volumes:
        - name: trilium
          persistentVolumeClaim:
            claimName: trilium
      # We want this deployment on a specific node
      nodeSelector:
        kubernetes.io/hostname: home-k8s01.sigurs.io