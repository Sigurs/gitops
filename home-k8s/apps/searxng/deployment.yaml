apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      containers:
        - name: container
          image: searxng/searxng:latest@sha256:db8b06c868a8f0e97e93eec361d860db4298e0e2b1e54326fb1103b0a294d213
          securityContext:
            runAsUser: 977
            runAsGroup: 977
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          env:
            - name: SEARXNG_BASE_URL
              value: "https://search.sigurs.io"

            # Security
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng
                  key: SEARXNG_SECRET

            - name: TZ
              value: Europe/Helsinki
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: searxng
              mountPath: /etc/searxng
              subPath: etc/searxng
            - name: searxng
              mountPath: /var/cache/searxng
              subPath: var/cache/searxng
      volumes:
        - name: searxng
          persistentVolumeClaim:
            claimName: searxng