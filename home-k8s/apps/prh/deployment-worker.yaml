# replicas MUST stay at 1: APScheduler's cron triggers are not cluster-safe,
# so a second replica would double-run every job.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prh-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prh-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prh-worker
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      # PVC mounts land as root:root by default; fsGroup makes the volume
      # writable by the app user (uid/gid 1000, pinned in the Dockerfile).
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      containers:
        - name: worker
          image: ghcr.io/sigurs/prh:latest
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: prh-config
            - secretRef:
                name: prh-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ytj-files
              mountPath: /data/ytj
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ytj-files
          persistentVolumeClaim:
            claimName: prh-ytj-files
        - name: tmp
          emptyDir: {}
      nodeSelector:
        kubernetes.io/hostname: home-k8s01.sigurs.io
