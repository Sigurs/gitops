apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: chromium
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chromium
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      containers:
        - name: chromium
          image: ghcr.io/browserless/chromium:v2.57.0@sha256:6bac628b3d8293f8fb251d3a6b63030dfc5a1cb0c7e5c39abe5efd8f4b25360b
          securityContext:
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/playwright-seccomp.json
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: chromium-api
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Helsinki
            # Exposed via ingress, so require a token. Secret is created out-of-band.
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: chromium-token
                  key: token
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
      # Pinned to the node that carries the localhost seccomp profile
      nodeSelector:
        kubernetes.io/hostname: home-k8s01.sigurs.io
