apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chromium
spec:
  rules:
    - host: chromium.home-k8s.sigurs.io
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: chromium
              port:
                name: chromium-api
