apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: akri
spec:
  project: home-k8s.admin
  sources:
    - chart: akri
      repoURL: https://project-akri.github.io/akri/
      targetRevision: 0.13.8
      helm:
        valuesObject:
          webhookConfiguration:
            enabled: false
          udev:
            discovery:
              enabled: true
    - repoURL: https://github.com/Sigurs/gitops.git
      targetRevision: HEAD
      path: home-k8s/admin/akri
  destination:
    server: https://kubernetes.default.svc
    namespace: akri
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
