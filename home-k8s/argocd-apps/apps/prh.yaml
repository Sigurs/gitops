apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prh
spec:
  project: home-k8s
  source:
    repoURL: https://github.com/Sigurs/gitops.git
    targetRevision: HEAD
    path: home-k8s/apps/prh/
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-prh
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
